// Inicializar Firebase
const app = firebase.initializeApp(firebaseConfig);

// ============================================
// SERVICIO DE DATOS
// ============================================

const DataService = {
  // REPORTES
  addReport: async function(report) {
    try {
      const docRef = await db.collection('reportes').add({
        ...report,
        date: firebase.firestore.FieldValue.serverTimestamp(),
        status: 'Pendiente'
      });
      return { success: true, id: docRef.id };
    } catch (error) {
      console.error('Error adding report:', error);
      throw error;
    }
  },

  getReports: function(callback) {
    return db.collection('reportes')
      .orderBy('date', 'desc')
      .onSnapshot((snapshot) => {
        const reports = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data(),
          date: doc.data().date?.toDate()
        }));
        callback(reports);
      });
  },

  updateStatus: async function(id, status) {
    try {
      await db.collection('reportes').doc(id).update({ status });
      return { success: true };
    } catch (error) {
      console.error('Error updating status:', error);
      throw error;
    }
  },

  // AVISOS
  getAvisos: function(callback) {
    return db.collection('avisos')
      .where('active', '==', true)
      .orderBy('date', 'desc')
      .onSnapshot((snapshot) => {
        const avisos = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        callback(avisos);
      });
  },

  getAllAvisos: function(callback) {
    return db.collection('avisos')
      .orderBy('date', 'desc')
      .onSnapshot((snapshot) => {
        const avisos = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        callback(avisos);
      });
  },

  addAviso: async function(aviso) {
    try {
      const docRef = await db.collection('avisos').add({
        ...aviso,
        date: firebase.firestore.FieldValue.serverTimestamp(),
        active: true
      });
      return { success: true, id: docRef.id };
    } catch (error) {
      console.error('Error adding aviso:', error);
      throw error;
    }
  },

  updateAviso: async function(id, aviso) {
    try {
      await db.collection('avisos').doc(id).update(aviso);
      return { success: true };
    } catch (error) {
      console.error('Error updating aviso:', error);
      throw error;
    }
  },

  toggleAvisoStatus: async function(id, currentStatus) {
    try {
      await db.collection('avisos').doc(id).update({
        active: !currentStatus
      });
      return { success: true };
    } catch (error) {
      console.error('Error toggling aviso:', error);
      throw error;
    }
  },

  deleteAviso: async function(id) {
    try {
      await db.collection('avisos').doc(id).delete();
      return { success: true };
    } catch (error) {
      console.error('Error deleting aviso:', error);
      throw error;
    }
  }
};

       </div>

// ============================================
// FORM VIEW
// ============================================

// ============================================
// FORM VIEW MEJORADO - ENFOQUE ESTUDIANTIL
// ============================================

const FormView = ({ setView }) => {
  const [step, setStep] = useState(1);
  const [formData, setFormData] = useState({ 
    numControl: '',
    type: 'Acoso', // Default: Acoso (lo más importante)
    desc: '',
    location: '',
    evidence: ''
  });
  const [isAnon, setIsAnon] = useState(true);
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [folio, setFolio] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSending(true);
    
    try {
      const result = await DataService.addReport({
        ...formData,
        isAnon
      });
      
      // Generar folio solo si NO es anónimo
      if (!isAnon && formData.numControl) {
        const folioNumber = `ITGAM-${new Date().getFullYear()}-${formData.numControl}`;
        setFolio(folioNumber);
      }
      setSent(true);
      
      setTimeout(() => {
        setSent(false);
        setFormData({ 
          numControl: '',
          type: 'Acoso',
          desc: '',
          location: '',
          evidence: ''
        });
        setStep(1);
        setView('home');
      }, 6000);
    } catch (error) {
      alert('Error al enviar reporte. Por favor intenta de nuevo.');
    } finally {
      setSending(false);
    }
  };

  const nextStep = () => {
    if (step === 1 && !isAnon && !formData.numControl) {
      alert('Por favor ingresa tu número de control');
      return;
    }
    if (step === 2 && !formData.desc) {
      alert('Por favor describe tu reporte');
      return;
    }
    if (step === 2 && formData.desc.length < 20) {
      alert('Por favor proporciona más detalles (mínimo 20 caracteres)');
      return;
    }
    setStep(step + 1);
  };

  const prevStep = () => setStep(step - 1);

  const typeIcons = {
    'Acoso': { icon: '⚠️', color: 'from-red-500 to-red-600', desc: 'Acoso escolar, bullying, hostigamiento' },
    'Violencia': { icon: '🚨', color: 'from-orange-500 to-orange-600', desc: 'Violencia física o verbal' },
    'Discriminación': { icon: '🤝', color: 'from-purple-500 to-purple-600', desc: 'Discriminación por cualquier motivo' },
    'Infraestructura': { icon: '🏗️', color: 'from-blue-500 to-blue-600', desc: 'Instalaciones en mal estado' },
    'Seguridad': { icon: '🔒', color: 'from-yellow-500 to-yellow-600', desc: 'Situaciones de riesgo o inseguridad' },
    'Académico': { icon: '📚', color: 'from-green-500 to-green-600', desc: 'Problemas académicos o con docentes' },
    'Otro': { icon: '📋', color: 'from-gray-500 to-gray-600', desc: 'Otro tipo de situación' }
  };

  // Pantalla de confirmación exitosa
  if (sent) {
    return (
      <div className="animate-in max-w-2xl mx-auto mt-8 px-4 mb-8">
        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
          <div className="bg-gradient-to-r from-green-500 to-emerald-600 p-8 text-white text-center">
            <div className="mx-auto w-20 h-20 bg-white rounded-full flex items-center justify-center mb-4">
              <svg className="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <h2 className="text-3xl font-bold mb-2">¡Reporte Recibido!</h2>
            <p className="text-green-100">Tu reporte ha sido registrado de forma segura</p>
          </div>
          
          <div className="p-8">
            {!isAnon && folio && (
              <div className="bg-gradient-to-br from-brand-50 to-blue-50 rounded-xl p-6 mb-6 border-2 border-brand-200">
                <p className="text-sm text-gray-600 mb-2 text-center font-semibold">Tu folio de seguimiento:</p>
                <p className="text-3xl font-bold text-brand-900 text-center tracking-wider mb-2">{folio}</p>
                <button 
                  onClick={() => {
                    navigator.clipboard.writeText(folio);
                    alert('Folio copiado al portapapeles');
                  }}
                  className="w-full mt-3 bg-white border-2 border-brand-300 text-brand-700 px-4 py-2 rounded-lg font-semibold hover:bg-brand-50 transition text-sm"
                >
                  📋 Copiar Folio
                </button>
                <p className="text-xs text-gray-500 mt-3 text-center">
                  Guarda este número para consultar el estado de tu reporte
                </p>
              </div>
            )}

            {isAnon && (
              <div className="bg-blue-50 rounded-xl p-6 mb-6 border-2 border-blue-200">
                <div className="text-center">
                  <div className="text-4xl mb-3">🔒</div>
                  <h3 className="font-bold text-lg text-gray-800 mb-2">Reporte Anónimo</h3>
                  <p className="text-sm text-gray-600">
                    Tu identidad está completamente protegida. Las autoridades darán seguimiento sin revelar quién reportó.
                  </p>
                </div>
              </div>
            )}

            <div className="space-y-3 text-sm">
              <div className="flex items-start gap-3 bg-green-50 p-3 rounded-lg">
                <div className="text-green-600 mt-0.5 text-xl">✓</div>
                <div>
                  <p className="font-semibold text-gray-800">Reporte enviado a las autoridades</p>
                  <p className="text-gray-600 text-xs">Tu reporte será atendido con la máxima prioridad</p>
                </div>
              </div>
              <div className="flex items-start gap-3 bg-blue-50 p-3 rounded-lg">
                <div className="text-blue-600 mt-0.5 text-xl">✓</div>
                <div>
                  <p className="font-semibold text-gray-800">Confidencialidad garantizada</p>
                  <p className="text-gray-600 text-xs">La información será tratada con absoluta discreción</p>
                </div>
              </div>
              <div className="flex items-start gap-3 bg-purple-50 p-3 rounded-lg">
                <div className="text-purple-600 mt-0.5 text-xl">✓</div>
                <div>
                  <p className="font-semibold text-gray-800">Seguimiento activo</p>
                  <p className="text-gray-600 text-xs">El departamento correspondiente revisará tu caso en máximo 24 horas</p>
                </div>
              </div>
            </div>

            <div className="mt-8 pt-6 border-t border-gray-200">
              <p className="text-center text-sm text-gray-600 mb-4">
                <strong>¿Necesitas apoyo inmediato?</strong>
              </p>
              <div className="bg-red-50 border-2 border-red-200 rounded-lg p-4 text-center">
                <p className="text-sm font-semibold text-red-800 mb-2">
                  📞 Línea de Ayuda 24/7
                </p>
                <p className="text-2xl font-bold text-red-600">01-800-AYUDA</p>
                <p className="text-xs text-red-700 mt-2">
                  Si estás en peligro inmediato, marca el 911

            </div>

            <button 
              onClick={() => setView('home')}
              className="w-full mt-6 bg-brand-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-brand-500 transition text-lg"
            >
              Volver al Inicio
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="animate-in max-w-3xl mx-auto mt-8 px-4 mb-8">
      {/* Header con mensaje de apoyo */}
      <div className="mb-6 text-center">
        <h2 className="text-4xl font-bold text-brand-900 mb-3">Tu Voz es Importante</h2>
        <p className="text-lg text-gray-600 max-w-2xl mx-auto">
          Este es un espacio seguro para reportar cualquier situación que afecte tu bienestar o el de tus compañeros.
        </p>
        
        {/* Barra de progreso */}
        <div className="mt-6 flex items-center gap-2 max-w-md mx-auto">
          <div className={`flex-1 h-2 rounded-full transition-all ${step >= 1 ? 'bg-brand-600' : 'bg-gray-200'}`}></div>
          <div className={`flex-1 h-2 rounded-full transition-all ${step >= 2 ? 'bg-brand-600' : 'bg-gray-200'}`}></div>
          <div className={`flex-1 h-2 rounded-full transition-all ${step >= 3 ? 'bg-brand-600' : 'bg-gray-200'}`}></div>
        </div>
        <div className="flex justify-between text-xs text-gray-500 mt-2 max-w-md mx-auto">
          <span>Identidad</span>
          <span>Detalles</span>
          <span>Confirmación</span>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
        <div className={`bg-gradient-to-r ${
          step === 1 ? 'from-blue-600 to-indigo-600' :
          step === 2 ? 'from-purple-600 to-pink-600' :
          'from-green-600 to-emerald-600'
        } p-6 text-white transition-all`}>
          <div className="flex items-center gap-4">
            <div className="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center text-3xl backdrop-blur-sm">
              {step === 1 && '👤'}
              {step === 2 && '📝'}
              {step === 3 && '✅'}
            </div>
            <div className="flex-1">
              <h3 className="text-2xl font-bold mb-1">
                {step === 1 && 'Paso 1: Tu Identidad'}
                {step === 2 && 'Paso 2: ¿Qué Sucedió?'}
                {step === 3 && 'Paso 3: Revisa y Confirma'}
              </h3>
              <p className="text-white/90 text-sm">
                {step === 1 && 'Puedes elegir reportar de forma anónima o identificarte'}
                {step === 2 && 'Comparte todos los detalles que consideres importantes'}
                {step === 3 && 'Verifica que todo esté correcto antes de enviar'}
              </p>
            </div>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="p-8">
          {/* PASO 1: IDENTIDAD */}
          {step === 1 && (
            <div className="space-y-6 animate-in">
              {/* Toggle Anónimo con mensaje especial para acoso */}
              <div className="bg-gradient-to-br from-red-50 via-orange-50 to-yellow-50 p-6 rounded-xl border-2 border-red-200">
                <div className="flex items-center gap-3 mb-4">
                  <div className="text-3xl">🛡️</div>
                  <div className="flex-1">
                    <h4 className="font-bold text-lg text-gray-800">
                      {isAnon ? 'Modo Anónimo Activado' : 'Modo Identificado'}
                    </h4>
                    <p className="text-sm text-gray-700">
                      {isAnon 
                        ? 'Nadie sabrá quién hizo este reporte. Tu seguridad es nuestra prioridad.' 
                        : 'Recibirás seguimiento directo de tu reporte mediante tu número de control'}
                    </p>
                  </div>
                  <button 
                    type="button"
                    onClick={() => setIsAnon(!isAnon)}
                    className={`relative w-16 h-8 rounded-full transition-all ${
                      isAnon ? 'bg-green-500' : 'bg-blue-500'
                    } shadow-lg`}
                  >
                    <div className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-transform shadow ${
                      isAnon ? 'left-1' : 'left-9'
                    }`}></div>
                  </button>
                </div>

                {!isAnon && (
                  <div className="mt-4 animate-in">
                    <label className="block text-sm font-bold text-gray-700 mb-2">
                      Número de Control *
                    </label>
                    <input 
                      required 
                      type="text"
                      maxLength="10"
                      className="border-2 border-gray-300 p-4 rounded-xl w-full focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-100 transition text-lg font-semibold" 
                      placeholder="Ej: 20240001" 
                      value={formData.numControl} 
                      onChange={e => setFormData({...formData, numControl: e.target.value.toUpperCase()})} 
                    />
                    <p className="text-xs text-gray-500 mt-2">
                      Tu número de control solo será usado para darte seguimiento, no se compartirá con nadie más
                    </p>
                  </div>
                )}
              </div>

              {/* Mensaje de apoyo */}
              <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg">
                <p className="text-sm text-blue-800">
                  <strong>💙 Recuerda:</strong> No estás solo/a. Este sistema está diseñado para protegerte y ayudarte. 
                  Todos los reportes son tratados con la máxima seriedad y confidencialidad.
                </p>
              </div>

              <div className="flex justify-end">
                <button
                  type="button"
                  onClick={nextStep}
                  className="bg-brand-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-brand-500 transition shadow-lg hover:shadow-xl text-lg"
                >
                  Continuar →
                </button>
              </div>
            </div>
          )}

          {/* PASO 2: DETALLES */}
          {step === 2 && (
            <div className="space-y-6 animate-in">

Entre más detalles proporciones, mejor podremos ayudarte."

                {!isAnon && formData.numControl && (

                    <h4 className="font-bold text-gray-700 mb-2 flex items-center gap-2">
                      <span>🎓</span> Información de Seguimiento
                    </h4>
                    <p className="text-gray-900">
                      <strong>Número de Control:</strong> {formData.numControl}
                    </p>
                    <p className="text-xs text-gray-600 mt-2">

                    <h4 className="font-bold text-gray-700 mb-2 flex items-center gap-2">
                      <span>🔒</span> Modo Anónimo

                    <h4 className="font-bold text-gray-700 mb-3 flex items-center gap-2">
                      <span>📸</span> Evidencia Adjunta
                    </h4>
                    <img 
                      src={formData.evidence} 
                      alt="Evidencia" 
                      className="max-w-full h-64 object-contain rounded-lg border-2 border-gray-300 bg-white"
                      onError={(e) => {
                        e.target.src = 'https://via.placeholder.com/400x200?text=Error+al+cargar+imagen';
                        e.target.className = 'max-w-full h-64 object-contain rounded-lg border-2 border-red-300';
                      }}
                    />

                )}
              </div>

              <div className="flex justify-between gap-3">
                <button
                  type="button"
                  onClick={prevStep}
                  className="bg-gray-200 text-gray-700 px-8 py-4 rounded-xl font-bold hover:bg-gray-300 transition"
                >
                  ← Modificar
                </button>
                <button
                  type="submit"
                  disabled={sending}
                  className="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 text-white px-10 py-4 rounded-xl font-bold hover:from-green-500 hover:to-emerald-500 transition shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed text-lg"
                >
                  {sending ? (
                    <span className="flex items-center justify-center gap-3">
                      <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
                      Enviando de forma segura...
                    </span>
                  ) : (
                    <span className="flex items-center justify-center gap-2">
                      <span>✓</span> Enviar Reporte
                    </span>
                  )}
                </button>
              </div>
            </div>
          )}
        </form>
      </div>

      {/* Información de contacto de emergencia */}
      <div className="mt-6 grid md:grid-cols-2 gap-4">
        <div className="bg-red-50 rounded-xl p-5 border-2 border-red-200">
          <h4 className="font-bold text-red-800 mb-2 flex items-center gap-2">
            <span>🚨</span> ¿Emergencia?
          </h4>
          <p className="text-sm text-red-700 mb-2">
            Si estás en peligro inmediato, no uses este formulario.
          </p>
          <p className="text-2xl font-bold text-red-600">Llama al 911</p>
        </div>
        
        <div className="bg-blue-50 rounded-xl p-5 border-2 border-blue-200">
        <h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
        <span>💬</span> Apoyo Psicológico
        </h4>
        <p className="text-sm text-blue-700 mb-2">
          Departamento de Orientación Educativa
         </p>
        <p className="text-lg font-bold text-blue-600">Edificio A</p>
        </div>
      </div>
    </div>
  );
};

const AdminView = () => {
  const [adminPass, setAdminPass] = useState('');
  const [isAdmin, setIsAdmin] = useState(false);
  const [activeTab, setActiveTab] = useState('reportes');
  const [reports, setReports] = useState([]);
  const [avisos, setAvisos] = useState([]);
  const [loading, setLoading] = useState(false);

  const [showAvisoForm, setShowAvisoForm] = useState(false);
  const [editingAviso, setEditingAviso] = useState(null);
  const [avisoForm, setAvisoForm] = useState({
    title: '',
    type: 'General',
    body: '',
    imageUrl: ''
  });

  useEffect(() => {
    let unsubscribe;
    if (isAdmin) {
      setLoading(true);
      if (activeTab === 'reportes') {
        unsubscribe = DataService.getReports((data) => {
          setReports(data);
          setLoading(false);
        });
      } else if (activeTab === 'avisos') {
        unsubscribe = DataService.getAllAvisos((data) => {
          setAvisos(data);
          setLoading(false);
        });
      }
    }
    return () => unsubscribe && unsubscribe();
  }, [isAdmin, activeTab]);

  const handleLogin = (e) => {
    e.preventDefault();
    if (adminPass === 'admin123') {
      setIsAdmin(true);
    } else {
      alert('Contraseña incorrecta');
    }
  };

  const handleResolve = async (id) => {
    try {
      await DataService.updateStatus(id, 'Resuelto');
    } catch (error) {
      alert('Error al actualizar');
    }
  };

  const handleToggleAviso = async (id, currentStatus) => {
    try {
      await DataService.toggleAvisoStatus(id, currentStatus);
    } catch (error) {
      alert('Error al cambiar estado');
    }
  };

  const handleDeleteAviso = async (id) => {
    if (confirm('¿Seguro que deseas eliminar este aviso?')) {
      try {
        await DataService.deleteAviso(id);
      } catch (error) {
        alert('Error al eliminar');
      }
    }
  };

  const handleSaveAviso = async (e) => {
    e.preventDefault();
    
    try {
      if (editingAviso) {
        await DataService.updateAviso(editingAviso.id, avisoForm);
      } else {
        await DataService.addAviso(avisoForm);
      }
      resetAvisoForm();
    } catch (error) {
      alert('Error al guardar aviso');
    }
  };

  const resetAvisoForm = () => {
    setAvisoForm({ title: '', type: 'General', body: '', imageUrl: '' });
    setEditingAviso(null);
    setShowAvisoForm(false);
  };

  const startEdit = (aviso) => {
    setEditingAviso(aviso);
    setAvisoForm({
      title: aviso.title,
      type: aviso.type,
      body: aviso.body,
      imageUrl: aviso.imageUrl || ''
    });
    setShowAvisoForm(true);
  };

  if (!isAdmin) {
    return (
      <div className="animate-in max-w-sm mx-auto mt-20 px-4 mb-8">
        <div className="bg-white p-8 rounded-xl shadow-lg text-center">
          <div className="bg-brand-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
            <div className="text-brand-600"><Icon path={ICONS.lock} /></div>
          </div>
          <h2 className="font-bold text-2xl mb-2 text-brand-900">Panel de Administración</h2>
          <p className="text-gray-500 text-sm mb-6">Solo personal autorizado</p>
          <form onSubmit={handleLogin}>
            <input 
              type="password" 
              placeholder="Contraseña" 
              className="border border-gray-300 p-3 rounded-lg w-full mb-4 focus:outline-none focus:border-brand-500" 
              value={adminPass} 
              onChange={e => setAdminPass(e.target.value)}
              required
            />
            <button type="submit" className="w-full bg-brand-900 text-white py-3 rounded-lg font-bold hover:bg-brand-800 transition">
              Iniciar Sesión
            </button>
            <p className="text-xs text-gray-400 mt-3">Clave demo: admin123</p>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div className="animate-in max-w-6xl mx-auto mt-8 px-4 mb-8">
      <div className="flex justify-between items-center mb-6">
        <div>
          <h2 className="text-3xl font-bold text-brand-900">Panel de Administración</h2>
          <p className="text-gray-500 text-sm mt-1">Gestiona reportes y avisos del sistema</p>
        </div>
        <button 
          onClick={() => {
            setIsAdmin(false);
            setAdminPass('');
          }} 
          className="text-red-600 text-sm font-semibold hover:text-red-800 flex items-center gap-2 bg-red-50 px-4 py-2 rounded-lg"
        >
          Cerrar Sesión
        </button>
      </div>

      <div className="bg-white rounded-lg shadow-sm mb-6 p-1 flex gap-2">
        <button
          onClick={() => setActiveTab('reportes')}
          className={`flex-1 py-3 px-6 rounded-md font-semibold transition ${
            activeTab === 'reportes' 
              ? 'bg-brand-900 text-white' 
              : 'text-gray-600 hover:bg-gray-100'
          }`}
        >
          📋 Reportes
        </button>
        <button
          onClick={() => setActiveTab('avisos')}
          className={`flex-1 py-3 px-6 rounded-md font-semibold transition ${
            activeTab === 'avisos' 
              ? 'bg-brand-900 text-white' 
              : 'text-gray-600 hover:bg-gray-100'
          }`}
        >
          📢 Avisos
        </button>
      </div>

      {loading ? (
        <div className="bg-white rounded-lg shadow-sm p-12 text-center">
          <div className="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 mb-4"></div>
          <p className="text-gray-500">Cargando...</p>
        </div>
      ) : (
        <>
          {activeTab === 'reportes' && (
            <div className="bg-white rounded-lg shadow-sm overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-gray-50 text-gray-700 font-bold border-b">
                    <tr>
                      <th className="p-4 text-left">Fecha</th>
                      <th className="p-4 text-left">Tipo</th>
                      <th className="p-4 text-left">Descripción</th>
                      <th className="p-4 text-left">Estado</th>
                      <th className="p-4 text-left">Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    {reports.length === 0 ? (
                      <tr>
                        <td colSpan="5" className="p-12 text-center text-gray-400">
                          No hay reportes registrados
                        </td>
                      </tr>
                    ) : (
                      reports.map(r => (
                        <tr key={r.id} className="border-b hover:bg-gray-50">
                          <td className="p-4 whitespace-nowrap">
                            {r.date ? new Date(r.date).toLocaleDateString('es-MX') : 'N/A'}
                          </td>
                          <td className="p-4">
                            <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">
                              {r.type}
                            </span>
                          </td>
                          <td className="p-4 max-w-md truncate">{r.desc}</td>
                          <td className="p-4">
                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                              r.status === 'Resuelto' 
                                ? 'bg-green-100 text-green-800' 
                                : 'bg-yellow-100 text-yellow-800'
                            }`}>
                              {r.status || 'Pendiente'}
                            </span>
                          </td>
                          <td className="p-4">
                            {r.status !== 'Resuelto' && (
                              <button 
                                onClick={() => handleResolve(r.id)} 
                                className="text-green-600 font-bold hover:text-green-800 text-sm"
                              >
                                ✓ Resolver
                              </button>
                            )}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab === 'avisos' && (
            <div>
              <div className="mb-4">
                <button
                  onClick={() => setShowAvisoForm(!showAvisoForm)}
                  className="bg-brand-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-brand-500 flex items-center gap-2"
                >
                  <span className="text-xl">+</span> 
                  {showAvisoForm ? 'Cancelar' : 'Crear Nuevo Aviso'}
                </button>
              </div>

              {showAvisoForm && (
                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                  <h3 className="text-xl font-bold text-brand-900 mb-4">
                    {editingAviso ? 'Editar Aviso' : 'Nuevo Aviso'}
                  </h3>
                  
                  <form onSubmit={handleSaveAviso} className="space-y-4">
                    <input
                      type="text"
                      required
                      placeholder="Título del aviso"
                      className="border p-3 rounded-lg w-full"
                      value={avisoForm.title}
                      onChange={e => setAvisoForm({...avisoForm, title: e.target.value})}
                    />

                    <select
                      className="border p-3 rounded-lg w-full bg-white"
                      value={avisoForm.type}
                      onChange={e => setAvisoForm({...avisoForm, type: e.target.value})}
                    >
                      <option>General</option>
                      <option>Sistemas</option>
                      <option>Comunidad</option>
                      <option>Académico</option>
                      <option>Urgente</option>
                    </select>

                    <textarea
                      required
                      rows="3"
                      placeholder="Descripción"
                      className="border p-3 rounded-lg w-full"
                      value={avisoForm.body}
                      onChange={e => setAvisoForm({...avisoForm, body: e.target.value})}
                    />

                    <div>
                      <input
                        type="url"
                        placeholder="URL de imagen (Google Drive)"
                        className="border p-3 rounded-lg w-full"
                        value={avisoForm.imageUrl}
                        onChange={e => setAvisoForm({...avisoForm, imageUrl: e.target.value})}
                      />
                      <p className="text-xs text-gray-500 mt-1">
                        💡 Formato: https://drive.google.com/uc?id=TU_ID
                      </p>
                    </div>

                    <div className="flex gap-3">
                      <button
                        type="submit"
                        className="bg-brand-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-brand-500 flex-1"
                      >
                        {editingAviso ? 'Actualizar' : 'Crear'}
                      </button>
                      <button
                        type="button"
                        onClick={resetAvisoForm}
                        className="bg-gray-200 px-6 py-3 rounded-lg font-bold hover:bg-gray-300"
                      >
                        Cancelar
                      </button>
                    </div>
                  </form>
                </div>
              )}

              <div className="space-y-4">
                {avisos.length === 0 ? (
                  <div className="bg-white rounded-lg shadow-sm p-12 text-center">
                    <p className="text-gray-500">No hay avisos creados</p>
                  </div>
                ) : (
                  avisos.map(aviso => (
                    <div key={aviso.id} className="bg-white rounded-lg shadow-sm p-5">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h4 className="font-bold text-lg">{aviso.title}</h4>
                          <span className="text-xs bg-gray-100 px-2 py-1 rounded">{aviso.type}</span>
                        </div>
                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                          aviso.active ? 'bg-green-100 text-green-800' : 'bg-gray-100'
                        }`}>
                          {aviso.active ? 'Activo' : 'Inactivo'}
                        </span>
                      </div>
                      <p className="text-gray-600 text-sm mb-3">{aviso.body}</p>
                      
                      <div className="flex gap-2 flex-wrap">
                        <button
                          onClick={() => startEdit(aviso)}
                          className="text-blue-600 text-sm font-semibold"
                        >
                          ✏️ Editar
                        </button>
                        <button
                          onClick={() => handleToggleAviso(aviso.id, aviso.active)}
                          className="text-yellow-600 text-sm font-semibold"
                        >
                          {aviso.active ? '🔴 Desactivar' : '🟢 Activar'}
                        </button>
                        <button
                          onClick={() => handleDeleteAviso(aviso.id)}
                          className="text-red-600 text-sm font-semibold"
                        >
                          🗑️ Eliminar
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
};

// ============================================
// APP PRINCIPAL
// ============================================

function App() {
  const [view, setView] = useState('home');
  const [menuOpen, setMenuOpen] = useState(false);

  return (
    <div className="min-h-screen flex flex-col">
      <NavBar view={view} setView={setView} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <div className="flex-grow pb-10">
        {view === 'home' && <HomeView setView={setView} />}
        {view === 'denuncia' && <FormView setView={setView} />}
        {view === 'avisos' && <AvisosView />}
        {view === 'admin' && <AdminView />}
      </div>
      <footer className="text-center py-6 text-gray-400 text-xs bg-brand-900 text-white">
        © 2025 LibertITGAM | Versión Segura
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
